    <title>Karate Timeline</title>
    <style>
        #timeline {
            width: 100%;
            height: calc(100vh - 150px);
            min-height: 400px;
        }
        .vis-item.failed {
            background-color: #dc3545 !important;
            border-color: #b02a37 !important;
            color: white !important;
        }
        .vis-item.passed {
            background-color: #198754 !important;
            border-color: #146c43 !important;
            color: white !important;
        }
        .vis-label {
            font-size: 0.9rem;
        }
        .vis-item-content {
            font-size: 0.8rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        /* Dark mode support */
        [data-bs-theme="dark"] .vis-timeline {
            border-color: #495057;
        }
        [data-bs-theme="dark"] .vis-panel.vis-background,
        [data-bs-theme="dark"] .vis-panel.vis-center {
            background-color: #212529;
        }
        [data-bs-theme="dark"] .vis-labelset .vis-label {
            background-color: #343a40;
            color: #f8f9fa;
            border-color: #495057;
        }
        [data-bs-theme="dark"] .vis-time-axis .vis-text {
            color: #adb5bd;
        }
        [data-bs-theme="dark"] .vis-time-axis .vis-grid.vis-minor {
            border-color: #495057;
        }
        [data-bs-theme="dark"] .vis-time-axis .vis-grid.vis-major {
            border-color: #6c757d;
        }
    </style>
</head>
