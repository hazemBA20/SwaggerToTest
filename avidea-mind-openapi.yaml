openapi: 3.1.0
info:
  title: Avidea Mind API
  version: "1.0-20260424"
  description: >
    Avidea Mind is the project that contains Avidea AI agents and AI services
    (OCR, Intelligent Extraction). This document describes WebServices API
    exposed by Avidea Mind Project to third parties.
  contact:
    name: Avidea Support
    url: https://www.avidea.tn

servers:
  - url: "{server-prod-url}"
    description: Production server
    variables:
      server-prod-url:
        default: https://mind.avidea.tn/api
  - url: "{server-preprod-url}"
    description: Pre-production server used for testing new deployments
    variables:
      server-preprod-url:
        default: https://preprod.mind.avidea.tn/api
  - url: "{server-test-url}"
    description: Internal (test) server used for testing new API deployments
    variables:
      server-test-url:
        default: https://test.mind.avidea.tn/api

security:
  - JWTAuth: []
    api_key: []

paths:
  /version:
    get:
      summary: Returns the deployed API version
      operationId: getVersion
      parameters:
        - $ref: "#/components/parameters/ApiVersionHeader"
        - $ref: "#/components/parameters/AgentHeader"
      responses:
        "200":
          description: Returns the deployed API version information
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VersionResponse"
              example:
                version: "1.0-20260424"

  /registration-card/extract:
    post:
      summary: Extracts vehicle registration card information using OCR
      operationId: extractRegistrationCard
      parameters:
        - $ref: "#/components/parameters/ApiVersionHeader"
        - $ref: "#/components/parameters/AgentHeader"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/RegistrationCardExtractRequest"
      responses:
        "200":
          description: Returns extracted registration card information
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegistrationCardExtractResponse"
              example:
                requestId: "892d5757-28cc-407f-881c-55833811599d"
                registrationNumber: "1111TU111"
                chassisNumber: "VF3ABCD123456789"
                power: 5
                manufacturer: "PEUGEOT"
                typeMine: "207"
                releaseDate: "2012-05-15"
                energy: "ESSENCE"
                category: "VP"
        "400":
          description: Returns bad request if the file is not valid or extraction fails
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorType"
              example:
                success: false
                error: "BAD_REQUEST"
                details: "Invalid file format"
                api-version: "1.0"
        "500":
          description: Returns internal server error if extraction processing fails
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorType"
              example:
                success: false
                error: "INTERNAL_ERROR"
                details: "Failed to process registration card"
                api-version: "1.0"

components:
  parameters:
    ApiVersionHeader:
      name: X-AVIDEA-MIND-API-VERSION
      in: header
      required: false
      description: >
        The request API version. If not specified, latest version will be
        considered. The server can reject a request with an invalid API version.
      schema:
        type: string
    AgentHeader:
      name: X-AVIDEA-MIND-AGENT
      in: header
      required: false
      description: >
        The user agent used to connect to the API. Mainly used by the Mobile
        Application in the Login call. The server can reject a request with
        an invalid user agent or version.
      schema:
        type: string

  securitySchemes:
    JWTAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    api_key:
      type: apiKey
      in: header
      name: X-API-KEY

  schemas:
    RegistrationCardExtractRequest:
      type: object
      description: Registration card file to extract information from.
      required:
        - registrationDocument
        - requestId
      properties:
        registrationDocument:
          type: string
          format: binary
          description: The registration card image file (JPEG, PNG, PDF)
        requestId:
          type: string
          description: >
            The request id. This is used to track the request and to
            identify the response.
          example: "892d5757-28cc-407f-881c-55833811599d"
        requireBothSides:
          type: boolean
          description: Optional flag to require both sides of the document
          default: false

    RegistrationCardExtractResponse:
      type: object
      description: Response containing extracted registration card information.
      required:
        - registrationNumber
        - chassisNumber
      properties:
        requestId:
          type: string
          description: >
            The request id. This is used to track the request and to
            identify the response.
          example: "892d5757-28cc-407f-881c-55833811599d"
        registrationNumber:
          type: string
          description: "Immatriculation - Vehicle registration number"
          example: "1111TU111"
        chassisNumber:
          type: string
          description: "Numéro de châssis - Chassis/VIN number"
          example: "VF3ABCD123456789"
        power:
          type: integer
          description: "Puissance (CV) - Engine power in horsepower"
          example: 5
        manufacturer:
          type: string
          description: "Marque - Vehicle manufacturer/brand"
          example: "PEUGEOT"
        typeMine:
          type: string
          description: "Type mine - Vehicle type/model"
          example: "207"
        releaseDate:
          type: string
          format: date
          description: "Date de mise en circulation - Vehicle release/first registration date"
          example: "2012-05-15"
        energy:
          type: string
          description: "Vehicle energy/fuel type"
          enum:
            - "NULL"
            - ESSENCE
            - DIESEL
            - NATURAL_GAS
            - ELECTRIC
            - HYBRIDS
            - PLUG_IN_HYBRIDS
            - HYBRID_GASOLINE
            - HYBRID_DIESEL
            - GNV
            - ETHANOL
          example: "ESSENCE"
        category:
          type: string
          description: "Vehicle category/type"
          enum:
            - "NULL"
            - VP
            - VU
            - VUL
            - TCP
            - VM
            - MOTORBIKE
            - BUS
            - MINI_BUS
            - MIXED
            - TRACTOR
            - ROAD_TRACTOR
            - TRAILER
            - GEAR
            - AGRICULTURAL_EQUIPMENT
            - DOUBLE_DECKER_BUS
            - ARTICULATED_BUS
            - COACH
            - DOUBLE_DECKER_COACH
            - IMPERIAL_COACH
            - ARTICULATED_COACH
            - TRUCK
            - VAN
            - C_MOPED
            - SPECIAL_GEAR
            - V_UNKNOWN
            - FORESTRY_EQUIPMENT
            - MICROBUS
            - MICROCAR
            - MOTORCYCLE
            - QUADRICYCLE
            - AGRICULTURAL_TOWING
            - LIGHT_TOWING
            - SEMI_TOWING
            - AGRICULTURAL_SEMI_TRAILING
            - TCP_WEIGHT
            - TRICYCLE
            - URGENT_INTERVENTION_VEHICLE
            - VERY_SPECIAL_VEHICLE
            - V_MOPED
            - CART
          example: "VP"

    VersionResponse:
      type: object
      description: VersionResponse details all API version information.
      required:
        - version
      properties:
        version:
          type: string
          description: version string
          example: "1.0-20260424"

    ErrorType:
      type: object
      description: Message format when any error occurs.
      required:
        - success
        - error
      properties:
        success:
          type: boolean
          enum: [false]
          description: "The value must be 'false'"
          example: false
        error:
          type: string
          description: An error code
          example: "NOT_FOUND"
        details:
          type: string
          description: A user friendly error message. Can be null or non present
          example: "mission not found"
        api-version:
          type: string
          description: Server side api-version
          example: "1.0"
