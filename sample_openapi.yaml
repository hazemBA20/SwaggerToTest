openapi: 3.0.3
info:
  title: Users API
  version: 1.0.0
servers:
  - url: http://localhost:8000
paths:
  /users:
    post:
      operationId: createUser
      summary: Create a user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email]
              properties:
                name:
                  type: string
                  minLength: 1
                  example: Ada Lovelace
                email:
                  type: string
                  format: email
                  example: ada@example.com
                role:
                  type: string
                  enum: [member, admin]
      responses:
        '201':
          description: User created
        '400':
          description: Invalid request
  /users/{userId}:
    get:
      operationId: getUser
      summary: Get a user
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
          example: 1
      responses:
        '200':
          description: User found
        '404':
          description: User not found
